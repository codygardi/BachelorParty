<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Shared RSVP page for Robbie Merchant's January 2027 bachelor party in Grass Valley, California."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="bachelor-party.css?v=20260815c">
    <title>Robbie's Bachelor Party RSVP</title>
  </head>
  <body>
    <main class="page-shell">
      <div class="rsvp-page" data-rsvp-page>
        <section class="quest-notice" aria-labelledby="page-title">
          <img
            src="assets/quest-banner.png"
            class="quest-banner"
            alt="Parchment quest banner with a d20 and mountain trail"
          >
          <p class="eyebrow">Quest notice</p>
          <h1 id="page-title">Robbie's Bachelor Party RSVP</h1>
          <p class="hero-lead">
            Review the final party roster, selected weekend, and complete quest itinerary below.
          </p>
        </section>

        <section id="quest-details" class="details-page" data-details-page aria-label="Quest details dashboard">
          <article class="details-card party-overview-card" aria-labelledby="party-overview-title">
            <div class="panel-heading static-panel-heading">
              <div>
                <p class="eyebrow">Party log &amp; availability</p>
                <h2 id="party-overview-title">The adventuring party</h2>
              </div>
              <span class="party-count" data-party-count></span>
            </div>
            <ul class="party-roster" data-response-list></ul>
          </article>

          <article class="details-card quest-details-card" aria-labelledby="quest-dashboard-title">
            <div class="panel-heading static-panel-heading">
              <div>
                <p class="eyebrow">Quest details</p>
                <h2 id="quest-dashboard-title">Weekend plan</h2>
              </div>
            </div>

            <div class="quest-weekend-block" aria-label="Weekend selection">
              <div class="overlap-summary" data-overlap-summary></div>
              <div class="overlap-list" data-overlap-list></div>
            </div>

            <div class="trip-list" data-trip-details></div>
          </article>
        </section>
      </div>
    </main>

    <footer class="page-footer">
      <p>Celebrating Robbie Merchant in Grass Valley, CA.</p>
    </footer>

    <script src="bachelor-party-config.js?v=20260815c"></script>
    <script src="bachelor-party.js?v=20260815c"></script>
  </body>
</html>
